{% extends "admin/admin-base.html" %}
{% block adminContent %}
<h1 class="h2">Resource types</h1>

<form method="post" action="/admin/resource-types/create" class="form-inline mb-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group mr-2">
        <label for="name" class="sr-only">Name</label>
        <input type="text" class="form-control" name="name" id="name" placeholder="Name" required>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
</form>

<table class="table table-striped">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>
                    <a href="/admin/resource-types/{{ item.id }}/edit" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form method="post" action="/admin/resource-types/{{ item.id }}/delete" class="d-inline"
                          onsubmit="return confirm('Delete resource type {{ item.name }}?');">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="3">No resource types yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
