{% extends "base.html" %}

{% block navbar %}
<div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item navbar-text text-primary">ADMINISTRATION</li>
    </ul>
    <form method="post" action="/admin/logout" class="form-inline my-2 my-lg-0">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-success my-2 my-sm-0">Sign out</button>
    </form>
</div>
{% endblock %}

{% block main %}
<main role="main">
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/admin/">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/bookings">Bookings</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/resources">Resources</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/resource-types">Resource types</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/windows">Availability windows</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/exceptions">Exceptions</a></li>
                    </ul>
                </div>
            </nav>
            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 pt-3 px-4">
                {% block adminContent %}
                <p>This is admin.</p>
                {% endblock %}
            </main>
        </div>
    </div>
</main>
{% endblock %}
