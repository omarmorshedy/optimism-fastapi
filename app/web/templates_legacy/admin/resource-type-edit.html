{% extends "admin/admin-base.html" %}
{% block adminContent %}
<h1 class="h2">Edit resource type</h1>
<form method="post" action="/admin/resource-types/{{ item.id }}/edit" class="col-md-6 px-0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" name="name" id="name" value="{{ item.name }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/resource-types" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
