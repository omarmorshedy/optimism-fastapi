{% extends "admin/admin-base.html" %}
{% block adminContent %}
<h1 class="h2">Edit availability window</h1>
<form method="post" action="/admin/windows/{{ item.id }}/edit" class="col-md-6 px-0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="resourceId">Resource</label>
        <select class="form-control" name="resourceId" id="resourceId" required>
            {% for resource in resources %}
                <option value="{{ resource.id }}" {% if resource.id == item.resourceId %}selected{% endif %}>{{ resource.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="weekday">Weekday (0=Sun … 6=Sat)</label>
        <input type="number" class="form-control" name="weekday" id="weekday" min="0" max="6" value="{{ item.weekday }}" required>
    </div>
    <div class="form-group">
        <label for="starts">Starts (HH:MM, UTC)</label>
        <input type="time" class="form-control" name="starts" id="starts" value="{{ item.starts }}" required>
    </div>
    <div class="form-group">
        <label for="ends">Ends (HH:MM, UTC)</label>
        <input type="time" class="form-control" name="ends" id="ends" value="{{ item.ends }}" required>
    </div>
    <div class="form-group">
        <label for="name">Name (optional)</label>
        <input type="text" class="form-control" name="name" id="name" value="{{ item.name or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/windows" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
