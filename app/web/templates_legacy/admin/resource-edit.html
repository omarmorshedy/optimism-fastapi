{% extends "admin/admin-base.html" %}
{% block adminContent %}
<h1 class="h2">Edit resource</h1>
<form method="post" action="/admin/resources/{{ item.id }}/edit" class="col-md-6 px-0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" name="name" id="name" value="{{ item.name }}" required>
    </div>
    <div class="form-group">
        <label for="resourceTypeId">Type</label>
        <select class="form-control" name="resourceTypeId" id="resourceTypeId">
            <option value="">— none —</option>
            {% for type in types %}
                <option value="{{ type.id }}" {% if type.id == item.resourceTypeId %}selected{% endif %}>{{ type.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="capacity">Capacity</label>
        <input type="number" class="form-control" name="capacity" id="capacity" min="1" value="{{ item.capacity }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/resources" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
