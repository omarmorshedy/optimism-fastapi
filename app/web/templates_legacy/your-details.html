{% extends "base.html" %}
{% block main %}
<main role="main">
    <div class="booking-step">
        <div class="container">
            <h1>Make a booking</h1>
            <h2><small class="text-muted">Step 3 of 3</small><br>Your details</h2>
        </div>
    </div>
    <div class="container">
        <div class="container">
            <h3>Booking Details</h3>
            <p>Booking {{ resource.name }} from {{ friendlyStartTime }} to {{ friendlyEndTime }}</p>
            <form method="POST" action="/confirmation" id="enter-details-form">
                <input type="hidden" name="starts" value="{{ startTime }}">
                <input type="hidden" name="ends" value="{{ endTime }}">
                <input type="hidden" name="resourceId" value="{{ resource.id }}">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" class="form-control" name="name" id="name" placeholder="Your name here" required>
                </div>
                <div class="form-group">
                    <label for="email">Email address:</label>
                    <input type="email" class="form-control" name="email" id="email" placeholder="Where we should email your booking" required>
                </div>
                <div class="form-group">
                    <label for="notes">Any notes:</label>
                    <textarea class="form-control" name="notes" id="notes" placeholder="Any messages you want to include"></textarea>
                </div>
                <div class="form-group">
                    <input type="submit" class="btn btn-primary" name="submit" value="Complete your booking &raquo;">
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
