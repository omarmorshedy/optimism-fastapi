<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Optimism — DoES Liverpool bookings{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/optimism.css?v=1">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="/">Optimism</a></p>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/select-a-resource">Start a booking</a></li>
          <li><a href="/admin/login">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>DoES Liverpool resource bookings.</p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
