{% extends "base.html" %}
{% block title %}Your details{% endblock %}
{% block content %}
<h1>Your details</h1>
<p><strong>{{ resource.name }}</strong> — {{ friendlyStartTime }} to {{ friendlyEndTime }}</p>
<form method="post" action="/confirmation">
  <input type="hidden" name="resourceId" value="{{ resource.id }}">
  <input type="hidden" name="starts" value="{{ startTime }}">
  <input type="hidden" name="ends" value="{{ endTime }}">
  <p>
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required autocomplete="name">
  </p>
  <p>
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required autocomplete="email">
  </p>
  <p>
    <label for="notes">Notes (optional)</label>
    <textarea id="notes" name="notes" rows="4"></textarea>
  </p>
  <p><button type="submit" class="button button-primary">Confirm booking</button></p>
</form>
{% endblock %}
