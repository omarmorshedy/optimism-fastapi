{% extends "admin/admin-base.html" %}
{% block title %}Edit window — Optimism admin{% endblock %}
{% block content %}
<h1>Edit availability window</h1>
<form method="post" action="/admin/windows/{{ item.id }}/edit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p>
    <label for="resourceId">Resource</label>
    <select id="resourceId" name="resourceId" required>
      {% for resource in resources %}
        <option value="{{ resource.id }}" {% if resource.id == item.resourceId %}selected{% endif %}>{{ resource.name }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="weekday">Weekday (0=Sunday … 6=Saturday)</label>
    <input type="number" id="weekday" name="weekday" min="0" max="6" value="{{ item.weekday }}" required>
  </p>
  <p>
    <label for="starts">Starts (HH:MM, UTC)</label>
    <input type="time" id="starts" name="starts" value="{{ item.starts }}" required>
  </p>
  <p>
    <label for="ends">Ends (HH:MM, UTC)</label>
    <input type="time" id="ends" name="ends" value="{{ item.ends }}" required>
  </p>
  <p>
    <label for="name">Name (optional)</label>
    <input type="text" id="name" name="name" value="{{ item.name or '' }}">
  </p>
  <p><button type="submit" class="button button-primary">Save</button></p>
  <p><a href="/admin/windows">Cancel</a></p>
</form>
{% endblock %}
