{% extends "admin/admin-base.html" %}
{% block title %}Edit resource — Optimism admin{% endblock %}
{% block content %}
<h1>Edit resource</h1>
<form method="post" action="/admin/resources/{{ item.id }}/edit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ item.name }}" required>
  </p>
  <p>
    <label for="resourceTypeId">Resource type</label>
    <select id="resourceTypeId" name="resourceTypeId">
      <option value="">— none —</option>
      {% for type in types %}
        <option value="{{ type.id }}" {% if type.id == item.resourceTypeId %}selected{% endif %}>{{ type.name }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="capacity">Capacity</label>
    <input type="number" id="capacity" name="capacity" min="1" value="{{ item.capacity }}" required>
  </p>
  <p><button type="submit" class="button button-primary">Save</button></p>
  <p><a href="/admin/resources">Cancel</a></p>
</form>
{% endblock %}
