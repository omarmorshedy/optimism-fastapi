[project]
name = "optimism"
version = "0.1.0"
description = "DoES Liverpool resource-booking system — FastAPI replacement (v1)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DoES Liverpool" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-itsdangerous>=1.1",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require a real PostgreSQL database",
    "unit: fast, isolated unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
show_error_codes = true
exclude = ["migrations/env.py", "tests/e2e"]
mypy_path = "app"

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests are validated by ruff + pytest; mypy runs strict on the application.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
no_implicit_optional = false
allow_untyped_globals = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/migrations/*", "app/web/static/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
