# Optimism FastAPI — CI (plan §1 "Required GitHub Actions pipeline").
#
# Pull request: lint + format + types + unit/API tests; PostgreSQL-backed
# integration tests; production image build + smoke test.
# Push to main: full suite and image build.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Verify lockfile
        run: uv lock --check
      - name: Ruff format check
        run: uv run ruff format --check app tests
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: mypy
        run: uv run mypy app tests
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optimism
          POSTGRES_PASSWORD: optimism
          POSTGRES_DB: optimism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optimism"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://optimism:optimism@localhost:5432/optimism_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Unit + API + web tests
        run: uv run pytest tests/unit tests/api tests/web -p no:warnings
      - name: Coverage (branch, 80% floor)
        run: uv run pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml -p no:warnings
      - name: PostgreSQL integration tests (migrations, concurrency, constraints)
        run: uv run pytest tests/integration -p no:warnings
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - name: Dependency vulnerability scan
        run: uv run pip-audit || true

  image:
    name: Build & smoke test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: optimism:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: optimism:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
